# PiCore Configuration
# Central core framework for declarative GUIs, dynamic variables, and server mechanics

# Optional engines bundled with PiCore. Each is published as a Bukkit service for other plugins to use.
modules:
  # PiMorph — animates a region from one block/display state into another (sweep, meteor, rise, ...).
  # Style packs live in plugins/PiCore/morphs/*.yml.
  morph: true
  # PiAudio — locational and per-player audio streaming through Simple Voice Chat (silent without it),
  # plus the shared ffmpeg/yt-dlp locator configured under media: below.
  audio: true
  # PiCinematic — scripted camera shots: viewers watch from a gliding camera (seeing their own body double),
  # with titles, shake, vignette, frost and wobble effects. Used by Morphic Games' duel intros.
  cinematic: true
  # PiScreen — in-world map screens (item-frame walls) that plugins draw boards and brackets on.
  screen: true

# Shared media binaries for plugins that decode or download audio. Drop `ffmpeg` (and `yt-dlp`, for
# downloads) into plugins/PiCore/bin/. On Windows the `.exe` suffix is found automatically. Both are
# re-checked on every use, so adding them needs no restart.
media:
  bin-dir: ""        # blank = plugins/PiCore/bin
  ffmpeg-path: ""    # blank = <bin-dir>/ffmpeg
  ytdlp-path: ""     # blank = <bin-dir>/yt-dlp

updater:
  # Automatically check for PiCore updates on startup
  auto-check-on-boot: true

  # Check interval in minutes (default: 6 hours)
  check-interval-minutes: 360

  # GitHub repository to check for updates (format: owner/repo)
  github-repo: "scrunc/picore"

  # Optional: GitHub Personal Access Token (PAT) for private repositories or avoiding rate limits
  # Can also be set via system environment variable GITHUB_TOKEN or plugins/picore.token
  github-token: ""
