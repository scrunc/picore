# PiCore Configuration
# Central core framework for declarative GUIs, dynamic variables, and server mechanics

# Optional engines bundled with PiCore. Each is published as a Bukkit service for other plugins to use.
modules:
  # PiMorph — animates a region from one block/display state into another (sweep, meteor, rise, ...).
  # Style packs live in plugins/PiCore/morphs/*.yml.
  morph: true

updater:
  # Automatically check for PiCore updates on startup
  auto-check-on-boot: true

  # Check interval in minutes (default: 6 hours)
  check-interval-minutes: 360

  # GitHub repository to check for updates (format: owner/repo)
  github-repo: "scrunc/picore"

  # Optional: GitHub Personal Access Token (PAT) for private repositories or avoiding rate limits
  # Can also be set via system environment variable GITHUB_TOKEN or plugins/picore.token
  github-token: ""
